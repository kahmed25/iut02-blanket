version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - echo "NEXT_PUBLIC_API_URL=https://d3el0rz8hgjk9d.cloudfront.net" > .env.production
        - cat .env.production
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/out
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
